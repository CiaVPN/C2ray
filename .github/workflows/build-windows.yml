name: Build C2ray for Windows

on:
  push:
    branches:
      - main
    paths:
      - "Windows/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag. Blank uses v<version from Windows/version.txt>, e.g. v2.3.16."
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-arm64

    steps:
      - name: Checkout C2ray
        uses: actions/checkout@v7

      - name: Checkout pinned Windows client source
        shell: pwsh
        run: |
          git clone --depth 1 --branch 7.25.6 --recurse-submodules https://github.com/2dust/v2rayN.git Windows/_upstream
          if ($LASTEXITCODE -ne 0) {
            throw "Could not fetch the pinned v2rayN 7.25.6 source."
          }

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.1xx

      - name: Apply C2ray branding and official logos
        shell: pwsh
        run: |
          ./Windows/scripts/Apply-C2ray-Branding.ps1 -SourceRoot "Windows/_upstream"

      - name: Publish self-contained Windows application
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
          C2RAY_SIGNING_CERTIFICATE_BASE64: ${{ secrets.C2RAY_SIGNING_CERTIFICATE_BASE64 }}
          C2RAY_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.C2RAY_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "dist\$env:RID"
          New-Item -ItemType Directory -Path $publishDir -Force | Out-Null

          dotnet publish "Windows/_upstream/v2rayN/v2rayN/v2rayN.csproj" `
            --configuration Release `
            --runtime $env:RID `
            --self-contained true `
            --output $publishDir

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed for $env:RID."
          }

          $exe = Join-Path $publishDir "C2ray.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Expected C2ray.exe was not produced for $env:RID."
          }

          # Bundle the official architecture-matched Xray runtime so profiles can start
          # immediately after extraction, without a separate manual core download.
          $coreAssetName = if ($env:RID -eq "win-arm64") {
            "Xray-windows-arm64-v8a.zip"
          } else {
            "Xray-windows-64.zip"
          }

          $githubHeaders = @{
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "CiaVPN-C2ray-Windows-Build"
          }
          # Keep compatibility with legacy CiaConfig VLESS links that use security=none.
          # Xray v26.7.11+ rejects public VLESS without TLS/REALITY or VLESS Encryption.
          # Pin the last verified compatible release; prefer TLS/REALITY links whenever possible
          # because legacy plaintext VLESS has no transport encryption.
          $xrayCoreVersion = "v26.6.27"
          $xrayRelease = Invoke-RestMethod -Uri "https://api.github.com/repos/XTLS/Xray-core/releases/tags/$xrayCoreVersion" -Headers $githubHeaders
          if ($xrayRelease.tag_name -ne $xrayCoreVersion) {
            throw "Expected Xray-core $xrayCoreVersion but received $($xrayRelease.tag_name)."
          }

          $xrayAsset = $xrayRelease.assets |
            Where-Object { $_.name -eq $coreAssetName } |
            Select-Object -First 1
          if ($null -eq $xrayAsset) {
            throw "Xray-core $xrayCoreVersion does not contain $coreAssetName."
          }

          $xrayArchive = Join-Path $env:RUNNER_TEMP $coreAssetName
          $xrayExtract = Join-Path $env:RUNNER_TEMP "c2ray-xray-core"
          Invoke-WebRequest -Uri $xrayAsset.browser_download_url -OutFile $xrayArchive
          if (-not (Test-Path -LiteralPath $xrayArchive) -or (Get-Item -LiteralPath $xrayArchive).Length -lt 1000000) {
            throw "The Xray-core archive download is missing or incomplete."
          }

          if (Test-Path -LiteralPath $xrayExtract) {
            Remove-Item -LiteralPath $xrayExtract -Recurse -Force
          }
          New-Item -ItemType Directory -Path $xrayExtract -Force | Out-Null
          Expand-Archive -LiteralPath $xrayArchive -DestinationPath $xrayExtract -Force

          $xrayExecutable = Get-ChildItem -LiteralPath $xrayExtract -Filter "xray.exe" -File -Recurse |
            Select-Object -First 1
          if ($null -eq $xrayExecutable) {
            throw "The downloaded Xray-core archive does not contain xray.exe."
          }

          $xraySourceDir = $xrayExecutable.Directory.FullName
          $xrayTargetDir = Join-Path $publishDir "bin\xray"
          New-Item -ItemType Directory -Path $xrayTargetDir -Force | Out-Null
          Get-ChildItem -LiteralPath $xraySourceDir -File |
            Copy-Item -Destination $xrayTargetDir -Force

          $bundledXray = Join-Path $xrayTargetDir "xray.exe"
          if (-not (Test-Path -LiteralPath $bundledXray)) {
            throw "Xray-core was not placed at the required path: $bundledXray"
          }

          # v2rayN resolves geodata from the bin directory (bin\geosite.dat / bin\geoip.dat),
          # not from the nested bin\xray directory that contains the executable.
          $binDir = Join-Path $publishDir "bin"
          foreach ($geoFile in @("geoip.dat", "geosite.dat")) {
            $geoSource = Join-Path $xraySourceDir $geoFile
            if (-not (Test-Path -LiteralPath $geoSource)) {
              throw "The official Xray archive is missing required geodata file: $geoFile"
            }
            Copy-Item -LiteralPath $geoSource -Destination (Join-Path $binDir $geoFile) -Force
          }

          foreach ($requiredFile in @($bundledXray, (Join-Path $binDir "geoip.dat"), (Join-Path $binDir "geosite.dat"))) {
            if (-not (Test-Path -LiteralPath $requiredFile)) {
              throw "A required C2ray runtime file is missing: $requiredFile"
            }
          }
          Write-Host "Bundled compatible Xray-core $($xrayRelease.tag_name) and GeoIP/GeoSite data for $env:RID."

          $hasSigningCertificate = -not [string]::IsNullOrWhiteSpace($env:C2RAY_SIGNING_CERTIFICATE_BASE64)
          $hasSigningPassword = -not [string]::IsNullOrWhiteSpace($env:C2RAY_SIGNING_CERTIFICATE_PASSWORD)
          if ($hasSigningCertificate -and $hasSigningPassword) {
            $certificatePath = Join-Path $env:RUNNER_TEMP "c2ray-codesign.pfx"
            [System.IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:C2RAY_SIGNING_CERTIFICATE_BASE64)
            )

            $signTool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Directory.Name -eq "x64" } |
              Sort-Object -Property FullName -Descending |
              Select-Object -First 1
            if ($null -eq $signTool) {
              throw "Windows SDK signtool.exe was not found on the runner."
            }

            Get-ChildItem -LiteralPath $publishDir -Recurse -File |
              Where-Object { $_.Extension -in @(".exe", ".dll") } |
              ForEach-Object {
                & $signTool.FullName sign /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 /f $certificatePath /p $env:C2RAY_SIGNING_CERTIFICATE_PASSWORD $_.FullName
                if ($LASTEXITCODE -ne 0) {
                  throw "Authenticode signing failed for $($_.FullName)."
                }
              }

            Remove-Item -LiteralPath $certificatePath -Force
            Write-Host "C2ray binaries were Authenticode-signed."
          }
          elseif ($hasSigningCertificate -or $hasSigningPassword) {
            throw "Both C2RAY_SIGNING_CERTIFICATE_BASE64 and C2RAY_SIGNING_CERTIFICATE_PASSWORD secrets must be configured."
          }
          else {
            Write-Warning "No code-signing certificate configured; Windows may display a SmartScreen reputation warning."
          }

          Copy-Item -LiteralPath "Windows/README.txt" -Destination $publishDir
          Copy-Item -LiteralPath "LICENSE" -Destination (Join-Path $publishDir "LICENSE-GPL-3.0.txt")

          $zipName = if ($env:RID -eq "win-x64") { "C2ray-Windows-x64.zip" } else { "C2ray-Windows-arm64.zip" }
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "dist\$zipName"
          Compress-Archive -Path (Join-Path $publishDir "*") -DestinationPath $zipPath -CompressionLevel Optimal

          if (-not (Test-Path -LiteralPath $zipPath) -or (Get-Item -LiteralPath $zipPath).Length -lt 1000000) {
            throw "The Windows package was not created correctly: $zipPath"
          }

      - name: Package corresponding branded source (x64 job only)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $sourcePackage = Join-Path $env:GITHUB_WORKSPACE "dist\C2ray-Windows-source-7.25.6.zip"
          $sourceStage = Join-Path $env:GITHUB_WORKSPACE "dist\source"
          New-Item -ItemType Directory -Path $sourceStage -Force | Out-Null

          Copy-Item -Path "Windows/_upstream/v2rayN" -Destination $sourceStage -Recurse
          Copy-Item -LiteralPath "Windows/scripts/Apply-C2ray-Branding.ps1" -Destination $sourceStage
          Copy-Item -LiteralPath "Windows/UPSTREAM.md" -Destination $sourceStage
          Copy-Item -LiteralPath "Windows/README.txt" -Destination $sourceStage
          Copy-Item -LiteralPath ".github/workflows/build-windows.yml" -Destination $sourceStage
          Copy-Item -LiteralPath "LICENSE" -Destination (Join-Path $sourceStage "LICENSE-GPL-3.0.txt")

          foreach ($optionalFile in @("README.md", ".gitmodules")) {
            $optionalPath = Join-Path "Windows/_upstream" $optionalFile
            if (Test-Path -LiteralPath $optionalPath) {
              Copy-Item -LiteralPath $optionalPath -Destination $sourceStage
            }
          }

          Compress-Archive -Path (Join-Path $sourceStage "*") -DestinationPath $sourcePackage -CompressionLevel Optimal

          if (-not (Test-Path -LiteralPath $sourcePackage)) {
            throw "The corresponding source archive was not created."
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: C2ray-${{ matrix.rid }}
          path: dist/C2ray-Windows-${{ matrix.rid == 'win-x64' && 'x64' || 'arm64' }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload corresponding source archive
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v7
        with:
          name: C2ray-Windows-source
          path: dist/C2ray-Windows-source-7.25.6.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish versioned C2ray Windows release
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout version metadata
        uses: actions/checkout@v7

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          version="$(tr -d '\r\n ' < Windows/version.txt)"
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then
            tag="v$version"
          fi
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"

      - name: Download all Windows build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Upload packages to the selected release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          files: |
            release/*.zip
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
