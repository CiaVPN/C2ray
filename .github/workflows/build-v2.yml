name: C2ray 2.3.16 Android APK - Final Verified Build

on:
  push:
    branches:
      - v2-channel-sync-backend
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Keep at most one running build and one pending build for this branch.
# A newer push replaces a stale pending run without requiring gh CLI.
concurrency:
  group: c2ray-v2-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build verified C2ray ARM APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Cancel all older workflow runs on this branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_RUN="$GITHUB_RUN_ID"
          RUNS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?branch=$GITHUB_REF_NAME&per_page=100" --jq ".workflow_runs[] | select(.id != $CURRENT_RUN and .status != \"completed\") | [.id, .status] | @tsv")"

          if [[ -z "$RUNS" ]]; then
            echo "No older workflow runs need cancellation."
          else
            while IFS=$'\t' read -r RUN_ID RUN_STATUS; do
              [[ -z "$RUN_ID" ]] && continue
              echo "Cancelling older workflow run $RUN_ID (status: $RUN_STATUS)"
              if gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/cancel" >/dev/null 2>&1; then
                echo "Cancellation accepted for $RUN_ID"
              elif gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/force-cancel" >/dev/null 2>&1; then
                echo "Force-cancellation accepted for $RUN_ID"
              else
                echo "::error::Could not cancel older workflow run $RUN_ID (status: $RUN_STATUS)"
                exit 1
              fi
            done <<< "$RUNS"
          fi

      - name: Checkout C2ray source and pinned upstream
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and image tooling
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools" \
            "ndk;30.0.16248370"
          python3 -m pip install --user Pillow
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Verify exact upstream release source
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_UPSTREAM="57907cf354d9769200ed4717b4430d605abe0952"
          ACTUAL_UPSTREAM="$(git -C upstream rev-parse HEAD)"
          echo "Pinned v2rayNG source: $ACTUAL_UPSTREAM"
          test "$ACTUAL_UPSTREAM" = "$EXPECTED_UPSTREAM"
          grep -q 'versionName = "2.3.15"' upstream/V2rayNG/app/build.gradle.kts

      - name: Install official C2ray branding assets
        shell: bash
        run: |
          set -euo pipefail
          test -s branding/official_c2ray_logo.png
          # Keep the build self-contained. Replace this fallback with the
          # dedicated notification artwork when it is committed to branding/.
          if [[ ! -s branding/official_c2ray_notification.png ]]; then
            cp branding/official_c2ray_logo.png branding/official_c2ray_notification.png
          fi
          file branding/official_c2ray_logo.png branding/official_c2ray_notification.png

      - name: Apply C2ray identity and CiaConfig integration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/prepare_c2ray_v2.py scripts/apply_official_branding.py
          python3 scripts/prepare_c2ray_v2.py
          python3 scripts/apply_official_branding.py
          node --check cloudflare-worker/src/index.js

          APP="upstream/V2rayNG/app/src/main"
          GRADLE="upstream/V2rayNG/app/build.gradle.kts"
          grep -q 'applicationId = "com.C2ray.ang"' "$GRADLE"
          grep -q 'versionCode = 803' "$GRADLE"
          grep -q 'versionName = "2.3.16"' "$GRADLE"
          test -s "$APP/res/drawable/ic_telegram_24dp.xml"
          test -s "$APP/res/drawable-nodpi/c2ray_logo.png"
          test -s "$APP/res/drawable-nodpi/c2ray_notification.png"
          test -s "$APP/res/drawable-nodpi/ic_stat_name.png"
          test -s "$APP/res/drawable-nodpi/ic_stat_direct.png"
          test -s "$APP/res/drawable-nodpi/ic_stat_proxy.png"
          grep -q 'CiaConfigChannel(R.drawable.ic_telegram_24dp' "$APP/java/com/v2ray/ang/ui/main/MainDrawer.kt"
          grep -q 'R.drawable.ic_stat_name' "$APP/java/com/v2ray/ang/service/QSTileService.kt"
          echo "C2ray launcher, Telegram drawer, notification and Quick Settings resources are ready."

      - name: Check Cloudflare deployment credentials
        id: cloudflare_credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare Worker source was checked but not deployed. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable automatic deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy C2ray channel sync Worker
        if: steps.cloudflare_credentials.outputs.configured == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config cloudflare-worker/wrangler.toml

      - name: Build native tunnel libraries
        shell: bash
        run: |
          set -euo pipefail
          chmod +x upstream/compile-hevtun.sh upstream/V2rayNG/gradlew
          cd upstream
          ./compile-hevtun.sh
          mkdir -p V2rayNG/app/libs
          cp -R libs/. V2rayNG/app/libs/

      - name: Download matching Xray Android library
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_TAG="$(git -C upstream/AndroidLibXrayLite describe --tags --abbrev=0)"
          echo "Using AndroidLibXrayLite tag: $CURRENT_TAG"
          curl --fail --location --retry 3 \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/$CURRENT_TAG/libv2ray.aar" \
            --output upstream/V2rayNG/app/libs/libv2ray.aar
          test -s upstream/V2rayNG/app/libs/libv2ray.aar

      - name: Build ARMv7 and ARM64 APKs
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/V2rayNG
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon "-PABI_FILTERS=armeabi-v7a;arm64-v8a" assemblePlaystoreDebug
          mkdir -p "$GITHUB_WORKSPACE/build-dist"
          cp app/build/outputs/apk/playstore/debug/C2ray_2.3.16_armeabi-v7a.apk "$GITHUB_WORKSPACE/build-dist/"
          cp app/build/outputs/apk/playstore/debug/C2ray_2.3.16_arm64-v8a.apk "$GITHUB_WORKSPACE/build-dist/"

      - name: Verify APK package, version, ABI, alignment and signature
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/37.0.0/zipalign"

          for ABI in armeabi-v7a arm64-v8a; do
            APK="$GITHUB_WORKSPACE/build-dist/C2ray_2.3.16_$ABI.apk"
            test -s "$APK"
            unzip -t "$APK" >/dev/null
            "$ZIPALIGN" -c -p 4 "$APK"
            "$APKSIGNER" verify --verbose "$APK"
            BADGING="$("$AAPT" dump badging "$APK")"
            grep -q "package: name='com.C2ray.ang'" <<<"$BADGING"
            grep -q "versionName='2.3.16'" <<<"$BADGING"
            grep -q "native-code:.*$ABI" <<<"$BADGING"
            echo "Verified: $(basename "$APK")"
          done

      - name: Upload the two verified APKs
        uses: actions/upload-artifact@v4
        with:
          name: C2ray-2.3.16-ARMv7-ARM64-APKs
          path: build-dist/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload ARMv7 APK separately
        uses: actions/upload-artifact@v4
        with:
          name: C2ray-2.3.16-ARMv7
          path: build-dist/C2ray_2.3.16_armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload ARM64 APK separately
        uses: actions/upload-artifact@v4
        with:
          name: C2ray-2.3.16-ARM64
          path: build-dist/C2ray_2.3.16_arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
