name: C2ray 2.3.15 Android APK

on:
  push:
    branches:
      - v2-channel-sync-backend
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: c2ray-v2-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build verified C2ray ARM APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Cancel older queued C2ray runs on this branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100")"
          LATEST_RUN_ID="$(jq -r --arg branch "${GITHUB_REF_NAME}" --arg path ".github/workflows/build-v2.yml" '
            [.workflow_runs[] | select(.head_branch == $branch and .path == $path)]
            | sort_by(.run_number) | last | .id // empty
          ' <<<"$RUNS")"

          if [[ "$LATEST_RUN_ID" != "$GITHUB_RUN_ID" ]]; then
            echo "::error::This run is older than the latest C2ray build. It will not build."
            exit 1
          fi

          mapfile -t OLD_RUNS < <(jq -r --arg branch "${GITHUB_REF_NAME}" --arg current "${GITHUB_RUN_ID}" '
            .workflow_runs[]
            | select(.head_branch == $branch and (.id | tostring) != $current)
            | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")
            | .id
          ' <<<"$RUNS")

          for run_id in "${OLD_RUNS[@]}"; do
            echo "Cancelling previous C2ray Actions run: $run_id"
            # force-cancel works for queued, waiting and in-progress runs.
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/force-cancel" || true
          done

          echo "Only the newest C2ray build will continue."

      - name: Checkout C2ray source and pinned upstream
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout official C2ray logo repository
        uses: actions/checkout@v4
        with:
          repository: CiaVPN/C2ray-Logo
          ref: main
          path: branding-source
          fetch-depth: 1

      - name: Verify exact upstream release source
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_UPSTREAM="57907cf354d9769200ed4717b4430d605abe0952"
          ACTUAL_UPSTREAM="$(git -C upstream rev-parse HEAD)"
          echo "Pinned v2rayNG source: $ACTUAL_UPSTREAM"
          test "$ACTUAL_UPSTREAM" = "$EXPECTED_UPSTREAM"
          grep -q 'versionName = "2.3.15"' upstream/V2rayNG/app/build.gradle.kts

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and image tooling
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools" \
            "ndk;30.0.16248370"
          python3 -m pip install --user Pillow
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Install exact official C2ray logos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p branding
          cp "branding-source/ChatGPT Image Nov 4, 2026, 06_50_57 PM.png" branding/official_c2ray_logo.png
          cp "branding-source/InShot_20261104_190230658.png" branding/official_c2ray_notification.png
          test -s branding/official_c2ray_logo.png
          test -s branding/official_c2ray_notification.png
          file branding/*.png

      - name: Apply C2ray identity and CiaConfig integration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/prepare_c2ray_v2.py scripts/apply_official_branding.py
          python3 scripts/prepare_c2ray_v2.py
          python3 scripts/apply_official_branding.py
          node --check cloudflare-worker/src/index.js

          APP="upstream/V2rayNG/app/src/main"
          GRADLE="upstream/V2rayNG/app/build.gradle.kts"
          grep -q 'applicationId = "com.v2ray.ang"' "$GRADLE"
          grep -q 'versionCode = 802' "$GRADLE"
          grep -q 'versionName = "2.3.15"' "$GRADLE"
          test -s "$APP/res/drawable-nodpi/c2ray_logo.png"
          test -s "$APP/res/drawable-nodpi/c2ray_notification.png"
          test -s "$APP/res/drawable-nodpi/ic_stat_name.png"
          test -s "$APP/res/drawable-nodpi/ic_stat_proxy.png"
          test -s "$APP/res/drawable-nodpi/ic_stat_direct.png"
          grep -q 'R.drawable.ic_stat_name' "$APP/java/com/v2ray/ang/service/QSTileService.kt"
          echo "C2ray branding, notification icon and Quick Settings tile are ready."

      - name: Build native tunnel libraries
        shell: bash
        run: |
          set -euo pipefail
          chmod +x upstream/compile-hevtun.sh upstream/V2rayNG/gradlew
          cd upstream
          ./compile-hevtun.sh
          mkdir -p V2rayNG/app/libs
          cp -R libs/. V2rayNG/app/libs/

      - name: Download matching Xray Android library
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_TAG="$(git -C upstream/AndroidLibXrayLite describe --tags --abbrev=0)"
          echo "Using AndroidLibXrayLite tag: $CURRENT_TAG"
          curl --fail --location --retry 3 \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/$CURRENT_TAG/libv2ray.aar" \
            --output upstream/V2rayNG/app/libs/libv2ray.aar
          test -s upstream/V2rayNG/app/libs/libv2ray.aar

      - name: Build ARMv7 and ARM64 APKs in one Gradle run
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/V2rayNG
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon "-PABI_FILTERS=armeabi-v7a;arm64-v8a" assemblePlaystoreDebug
          mkdir -p "$GITHUB_WORKSPACE/build-dist"
          cp app/build/outputs/apk/playstore/debug/C2ray_2.3.15_armeabi-v7a.apk "$GITHUB_WORKSPACE/build-dist/"
          cp app/build/outputs/apk/playstore/debug/C2ray_2.3.15_arm64-v8a.apk "$GITHUB_WORKSPACE/build-dist/"

      - name: Verify APK files, package, version, ABI, alignment and signatures
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/37.0.0/zipalign"

          for ABI in armeabi-v7a arm64-v8a; do
            APK="$GITHUB_WORKSPACE/build-dist/C2ray_2.3.15_$ABI.apk"
            test -s "$APK"
            unzip -t "$APK" >/dev/null
            "$ZIPALIGN" -c -p 4 "$APK"
            "$APKSIGNER" verify --verbose "$APK"
            "$AAPT" dump badging "$APK" | grep -q "package: name='com.v2ray.ang'"
            "$AAPT" dump badging "$APK" | grep -q "versionName='2.3.15'"
            "$AAPT" dump badging "$APK" | grep -q "native-code:.*$ABI"
            echo "Verified: $(basename "$APK")"
          done

      - name: Upload only the two verified APKs
        uses: actions/upload-artifact@v4
        with:
          name: C2ray-2.3.15-ARMv7-ARM64-APKs
          path: build-dist/*.apk
          if-no-files-found: error
          retention-days: 14
